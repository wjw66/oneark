appId: app.oneark.desktop
productName: OneArk
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: native/oneark-native.node
    to: native/oneark-native.node
npmRebuild: false
win:
  executableName: OneArk
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: OneArk-${version}-windows-${arch}-setup.${ext}
mac:
  category: public.app-category.productivity
  minimumSystemVersion: '14.2'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OneArk 需要麦克风权限来录制你主动开始的音频。
    NSAudioCaptureUsageDescription: OneArk 需要系统声音权限来录制你主动开始的会议音频。
  artifactName: OneArk-${version}-macos-${arch}.${ext}
